<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="img/logo.png">
<title>Pontos Críticos MUSA</title>
<meta name="theme-color" content="#00928a">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}

/* Layout: one narrow column, like a route card in the driver's hand — filters, route list, then the route as a numbered road line of stops. */
:root{
  --bg:#eef3f3; --surface:#ffffff; --ink:#132321; --muted:#566664; --line:#d3dfde;
  --sign:#00928a; --sign-ink:#ffffff; --brand2:#21c6be; --danger:#b8321f; --danger-bg:#fbe9e5; --chip:#e6efee; --road:#7fbfba;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1817; --surface:#162221; --ink:#e8f1f0; --muted:#93a8a6; --line:#26403d;
  --sign:#21c6be; --sign-ink:#00211f; --brand2:#21c6be; --danger:#ff7a63; --danger-bg:#3a1c17; --chip:#1f302e; --road:#2f6b66; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1817; --surface:#162221; --ink:#e8f1f0; --muted:#93a8a6; --line:#26403d;
  --sign:#21c6be; --sign-ink:#00211f; --brand2:#21c6be; --danger:#ff7a63; --danger-bg:#3a1c17; --chip:#1f302e; --road:#2f6b66; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--sign);outline-offset:2px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:3px solid var(--sign)}
header.top .wrap{padding-block:12px;display:grid;gap:10px}
.brand{display:flex;align-items:center;gap:10px}
.logo{height:34px;width:auto;display:block;flex:none}
.vr{width:1px;align-self:stretch;background:var(--line)}
.diamond{width:30px;height:30px;flex:none;background:var(--sign);transform:rotate(45deg);border-radius:4px;display:grid;place-items:center;box-shadow:inset 0 0 0 2px var(--sign-ink)}
.diamond b{transform:rotate(-45deg);font-family:var(--display);font-weight:700;color:var(--sign-ink);font-size:20px;line-height:1}
.brand h1{margin:0;font-family:var(--display);font-weight:700;font-size:22px;color:var(--sign);letter-spacing:.02em;text-transform:uppercase;line-height:1}
.brand small{display:block;color:var(--muted);font-size:12.5px;letter-spacing:.02em}
.search{position:relative}
.search input{width:100%;font:inherit;font-size:16px;padding:11px 40px 11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.search input::-webkit-search-cancel-button{display:none}
.search button{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:none;width:36px;height:36px;color:var(--muted);font-size:20px}

main .wrap{padding-block:16px 48px;display:grid;gap:18px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--chip);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:none;padding:10px 6px;border-radius:9px;font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--sign);box-shadow:0 1px 3px rgb(0 0 0 / .12)}
.filters{display:grid;gap:8px}
.label{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:500;font-size:15px}
.chips button[aria-pressed="true"]{background:var(--sign);color:var(--sign-ink);border-color:var(--sign)}
.chips button span{opacity:.6;margin-left:4px;font-variant-numeric:tabular-nums}

.group h2{margin:6px 0 8px;font-family:var(--display);font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.03em}
.list{display:grid;gap:8px}
.route{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px}
.plate{font-family:var(--display);font-weight:700;font-size:17px;background:var(--sign);color:var(--sign-ink);border:0;border-radius:6px;padding:2px 7px;min-width:62px;text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap}
.route .nm{min-width:0}
.route .nm b{display:block;font-weight:600;font-size:16px;line-height:1.25}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;color:var(--muted);font-size:13.5px;margin-top:2px}
.count{font-family:var(--display);font-weight:700;font-size:22px;text-align:right;line-height:1}
.count small{display:block;font-family:var(--body);font-weight:500;font-size:11px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}

/* route view */
.back{border:0;background:none;padding:6px 0;color:var(--muted);font-weight:600;display:inline-flex;gap:6px;align-items:center}
.rhead{display:grid;gap:8px}
.rhead .plate{justify-self:start;font-size:22px}
.rhead h2{margin:0;font-family:var(--display);font-weight:700;font-size:32px;line-height:1.05;text-transform:uppercase;text-wrap:balance}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{background:var(--chip);border-radius:6px;padding:3px 8px;font-size:13.5px;font-weight:500}
.tag.hl{background:var(--sign);color:var(--sign-ink)}
.summary{color:var(--muted);font-size:14.5px}

.stops{list-style:none;margin:0;padding:0;display:grid;gap:0}
.stop{display:grid;grid-template-columns:34px 1fr;gap:12px;position:relative;padding-bottom:22px}
.stop::before{content:"";position:absolute;left:15px;top:34px;bottom:0;width:4px;background:repeating-linear-gradient(var(--road) 0 10px,transparent 10px 18px);border-radius:2px}
.stop:last-child::before{display:none}
.num{width:34px;height:34px;border-radius:50%;background:var(--sign);color:var(--sign-ink);border:3px solid var(--surface);box-shadow:0 0 0 2px var(--sign);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.card{min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.photos{display:grid;grid-auto-flow:column;grid-auto-columns:100%;overflow-x:auto;scroll-snap-type:x mandatory}
.photos button{border:0;padding:0;background:var(--chip);scroll-snap-align:start;display:block}
.photos img{display:block;width:100%;height:auto;aspect-ratio:var(--ar,4/3);object-fit:cover;max-height:300px}
.pc{font-size:12px;color:var(--muted);padding:4px 14px 0}
.body{padding:12px 14px 14px;display:grid;gap:10px}
.body h3{margin:0;font-family:var(--display);font-weight:700;font-size:21px;line-height:1.1;text-transform:uppercase;letter-spacing:.01em}
.body h3.na{color:var(--muted);font-family:var(--body);font-weight:500;text-transform:none;font-size:15px}
.risks{display:flex;flex-wrap:wrap;gap:6px}
.risk{font-size:13px;font-weight:500;padding:3px 9px;border-radius:999px;background:var(--chip)}
.risk.hi{background:var(--danger-bg);color:var(--danger)}
.do{border-left:4px solid var(--sign);background:var(--bg);border-radius:0 8px 8px 0;padding:8px 12px}
.do .label{display:block;margin-bottom:2px}
.do p{margin:0;font-weight:500}
.ctx{font-size:13px;color:var(--muted)}
.ctx button{border:0;background:none;padding:0;color:var(--ink);text-decoration:underline;font-weight:600;font-size:13px}

.empty{color:var(--muted);text-align:center;padding:32px 8px}
.foot{color:var(--muted);font-size:12.5px;text-align:center;padding-top:8px}

.lb{position:fixed;inset:0;z-index:20;background:rgb(0 0 0 / .92);display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px))}
.lb img{max-height:100%;max-width:100%;object-fit:contain;border-radius:6px}
.lb button{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);right:calc(env(safe-area-inset-right,0px) + 10px);border:0;background:rgb(255 255 255 / .15);color:#fff;width:44px;height:44px;border-radius:50%;font-size:24px}
@media (prefers-reduced-motion:no-preference){.route,.chips button,.seg button{transition:background-color .15s,box-shadow .15s}}
</style>

</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <img class="logo" src="img/logo.png" alt="Univale"><span class="vr" aria-hidden="true"></span>
      <div><h1>Pontos Críticos</h1><small>Transportes MUSA · Mina Central e Oeste</small></div>
    </div>
    <div class="search">
      <input id="q" type="search" placeholder="Buscar local, bairro ou rota…" autocomplete="off" aria-label="Buscar">
      <button id="qclear" aria-label="Limpar busca" hidden>×</button>
    </div>
  </div>
</header>
<main><div class="wrap" id="app"></div></main>
<div class="lb" id="lb" hidden><img id="lbimg" alt=""><button id="lbclose" aria-label="Fechar foto">×</button></div>

const R = DATA.rotas, DIMS = DATA.dims;

let navIn = false;
const HI = /atropel|queda|ponto cego/i;

try{ Object.assign(st, JSON.parse(localStorage.getItem('pc-filtros')||'{}')); }catch(e){}
const save = () => { try{ localStorage.setItem('pc-filtros', JSON.stringify(st)); }catch(e){} };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const plural = (n,a,b) => n + ' ' + (n===1?a:b);
const tipoTxt = t => t.map(x => x==='ESTAGIÁRIO'?'Estagiário':x==='TURNO'?'Turno':'ADM');
function meta(r){
  const m = [...tipoTxt(r.tipo)];
  if (r.horas.length) m.push((r.sent==='Chegada'?'Chegada ':'Saída ') + r.horas.join(' / '));
  if (r.dd) m.push('Dom. a dom.');
  return m;
}
function routeRow(r){
  return `<button class="route" data-id="${r.id}">
    <span class="plate">${esc(r.cod)}</span>
    <span class="nm"><b>${esc(r.nome)}</b><span class="meta">${meta(r).map(x=>`<span>${esc(x)}</span>`).join('')}</span></span>
    <span class="count">${r.p.length}<small>pontos</small></span></button>`;
}
function seg(key, vals){
  return `<div class="seg" role="group">${vals.map(v=>`<button data-k="${key}" data-v="${v}" aria-pressed="${st[key]===v}">${v}</button>`).join('')}</div>`;
}
function home(){
  const pool = R.filter(r => r.mina===st.mina && r.sent===st.sent);
  const cids = [...new Set(pool.map(r=>r.cid))];
  if (st.cid!=='Todas' && !cids.includes(st.cid)) st.cid='Todas';
  const shown = pool.filter(r => st.cid==='Todas' || r.cid===st.cid);
  const groups = {};
  shown.forEach(r => (groups[r.cid] ||= []).push(r));
  const nPts = shown.reduce((a,r)=>a+r.p.length,0);
  app.innerHTML = `
    <div class="filters">${seg('mina',['Mina Central','Mina Oeste'])}${seg('sent',['Chegada','Retorno'])}</div>
    <div class="filters"><span class="label">Cidade</span><div class="chips">

    </div></div>
    <div class="summary">${plural(shown.length,'rota','rotas')} · ${plural(nPts,'ponto crítico','pontos críticos')}. Toque na rota para ver os pontos com foto.</div>
    ${Object.entries(groups).map(([c,rs])=>`<section class="group"><h2>${esc(c)}</h2><div class="list">${rs.map(routeRow).join('')}</div></section>`).join('') || '<p class="empty">Nenhuma rota cadastrada aqui.</p>'}

}
function photos(fs){
  if (!fs.length) return '';

}
function stopCard(p, i, ctx){

    </div></article></li>`;
}

      <h2>${esc(r.nome)}</h2>
      <div class="tags"><span class="tag hl">${esc(r.mina)}</span><span class="tag hl">${esc(r.sent)}</span><span class="tag">${esc(r.cid)}</span>${meta(r).map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div>
      <div class="summary">${plural(r.p.length,'ponto crítico','pontos críticos')} na ordem do trajeto.</div>
    </div>
    <ol class="stops">${r.p.map((p,i)=>stopCard(p,i+1)).join('')}</ol>
    <button class="back" data-back>← Todas as rotas</button>`;
  scrollTo(0,0);
}
function search(term){
  const t = norm(term.trim());
  const hits = [];
  R.forEach(r => {
    const rm = norm(`${r.cod} ${r.nome} ${r.cid}`).includes(t);
    r.p.forEach((p,i) => { if (rm || norm(p.l+' '+p.m).includes(t)) hits.push([r,p,i]); });
  });
  const shown = hits.slice(0,60);
  app.innerHTML = `<div class="summary">${hits.length?plural(hits.length,'ponto encontrado','pontos encontrados'):'Nada encontrado'} para “${esc(term)}”${hits.length>60?' · mostrando os 60 primeiros':''}.</div>
    <ol class="stops">${shown.map(([r,p,i])=>stopCard(p,i+1,`<div class="ctx">${esc(r.mina)} · ${esc(r.sent)} · <button data-id="${r.id}">${esc(r.cod)} ${esc(r.nome)}</button> ${esc(meta(r).join(' · '))}</div>`)).join('')}</ol>`;
}
function render(){
  const id = location.hash.slice(1);
  const r = R.find(x=>x.id===id);
  if (q.value.trim().length>=2 && !r) return search(q.value);
  r ? route(r) : home();
}
app.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.img){ document.getElementById('lbimg').src = `img/${b.dataset.img}.jpg`; document.getElementById('lb').hidden=false; return; }
  if (b.dataset.id){ q.value=''; qclear.hidden=true; navIn=true; location.hash = b.dataset.id; return; }
  if ('back' in b.dataset){ if (navIn){ navIn=false; history.back(); } else { location.hash=''; } return; }
  if (b.dataset.k){ st[b.dataset.k]=b.dataset.v; if(b.dataset.k!=='cid') st.cid='Todas'; save(); home(); }
});
window.addEventListener('hashchange', render);
let tm; q.addEventListener('input', () => { qclear.hidden = !q.value; clearTimeout(tm); tm=setTimeout(()=>{ if(location.hash){ history.replaceState(null,'',location.pathname+location.search);} render(); },180); });
qclear.addEventListener('click', ()=>{ q.value=''; qclear.hidden=true; render(); q.focus(); });
const lb = document.getElementById('lb');
lb.addEventListener('click', ()=>{ lb.hidden=true; });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') lb.hidden=true; });
render();
</script>

</body>
</html>
